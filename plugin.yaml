name: hermes-business-brain
version: 0.2.0
manifest_version: 2
requires_hermes: ">=0.23.0"
description: >-
  Offline Obsidian "business brain" toolkit with a native English engine: 19 local,
  network-free Hermes tools that create, validate and query private knowledge vaults (including
  a read-only evolution scan), plus 21 bundled workflow skills. Every tool runs the engine
  in-process against user-provided paths only; nothing leaves the machine and no business
  data is bundled.
author: unsulabs
license: MIT
homepage: https://github.com/unsulabs/hermes-business-brain
python_dependencies:
  - PyYAML==6.0.3
  - jsonschema>=4.23,<5
provides_tools:
  - brain_doctor
  - brain_create_vault
  - brain_validate_vault
  - brain_status
  - brain_register_vault
  - brain_resolve_vault
  - brain_query
  - brain_capture
  - brain_knowledge_map
  - brain_relations
  - brain_references
  - brain_naming
  - brain_transcript_cycle
  - brain_propose
  - brain_card
  - brain_document
  - brain_knowledge_plan
  - brain_dx_apply
  - brain_evolution_scan
